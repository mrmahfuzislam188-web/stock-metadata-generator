<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Professional Metadata Generator - Premium Stock Tools</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0b111e;
            color: #e2e8f0;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Sidebar Styling */
        .sidebar {
            width: 290px;
            background-color: #0f172a;
            border-right: 1px solid #1e293b;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .logo-section {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 16px;
            font-weight: bold;
            color: #38bdf8;
            padding-bottom: 15px;
            border-bottom: 1px solid #1e293b;
        }

        .menu-title {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #64748b;
            margin-top: 10px;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .control-item {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .control-item label {
            font-size: 13px;
            color: #94a3b8;
        }

        .slider-container {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        input[type="range"] {
            flex: 1;
            accent-color: #38bdf8;
        }

        .range-val {
            font-size: 12px;
            background: #1e293b;
            padding: 2px 6px;
            border-radius: 4px;
            min-width: 25px;
            text-align: center;
        }

        /* Main Workspace */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            background-color: #0b111e;
            overflow-y: auto;
        }

        /* Top Navbar */
        .navbar {
            height: 65px;
            background-color: #0f172a;
            border-bottom: 1px solid #1e293b;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 30px;
        }

        .nav-title {
            font-size: 18px;
            font-weight: bold;
            color: #fff;
        }

        .nav-btn-group {
            display: flex;
            gap: 12px;
        }

        .nav-btn {
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 13px;
            cursor: pointer;
            border: none;
            font-weight: 500;
        }

        .btn-tutorial { background: #1e293b; color: #38bdf8; }
        .btn-premium { background: #eab308; color: #0f172a; font-weight: bold; }

        /* Dashboard Body */
        .dashboard-body {
            padding: 30px;
            max-width: 1200px;
            width: 100%;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 25px;
        }

        /* Platforms Tabs */
        .platforms-container {
            display: flex;
            justify-content: center;
            gap: 10px;
            background: #0f172a;
            padding: 10px;
            border-radius: 12px;
            border: 1px solid #1e293b;
        }

        .platform-tab {
            padding: 8px 16px;
            border-radius: 8px;
            background: transparent;
            border: 1px solid transparent;
            color: #94a3b8;
            cursor: pointer;
            font-size: 14px;
        }

        .platform-tab.active {
            background: #1e293b;
            border-color: #38bdf8;
            color: #38bdf8;
        }

        /* Workspace Grid */
        .workspace-grid {
            display: grid;
            grid-template-columns: 1.2fr 1fr;
            gap: 25px;
        }

        .card {
            background: #0f172a;
            border: 1px solid #1e293b;
            border-radius: 16px;
            padding: 25px;
        }

        /* Form Controls */
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 15px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            color: #94a3b8;
            margin-bottom: 6px;
        }

        .form-group input, .form-group textarea, .form-group select {
            width: 100%;
            background: #0b111e;
            border: 1px solid #1e293b;
            border-radius: 8px;
            padding: 12px;
            color: white;
            font-size: 14px;
        }

        .form-group input:focus, .form-group textarea:focus, .form-group select:focus {
            border-color: #38bdf8;
            outline: none;
        }

        /* Buttons Styling */
        .btn-ai-generate {
            width: 100%;
            background: linear-gradient(135deg, #a855f7, #38bdf8);
            color: white;
            padding: 14px;
            border-radius: 8px;
            border: none;
            font-weight: bold;
            cursor: pointer;
            font-size: 14px;
            margin-bottom: 15px;
            box-shadow: 0 4px 15px rgba(56, 189, 248, 0.2);
        }

        .btn-ai-generate:hover {
            opacity: 0.9;
        }

        .action-btns {
            display: flex;
            gap: 10px;
        }

        .btn-primary {
            flex: 1;
            background: #38bdf8;
            color: #0f172a;
            padding: 12px;
            border-radius: 8px;
            border: none;
            font-weight: bold;
            cursor: pointer;
        }

        .btn-secondary {
            flex: 1;
            background: #1e293b;
            color: white;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #334155;
            cursor: pointer;
            text-align: center;
        }

        /* Output Window */
        .output-header {
            font-size: 15px;
            font-weight: bold;
            margin-bottom: 15px;
            color: #38bdf8;
            display: flex;
            justify-content: space-between;
        }

        #result {
            background: #0b111e;
            border: 1px solid #1e293b;
            border-radius: 8px;
            padding: 15px;
            min-height: 320px;
            white-space: pre-wrap;
            font-family: monospace;
            font-size: 13px;
            color: #cbd5e1;
            overflow-y: auto;
        }

        /* Premium Modal Paywall styling */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }

        .modal-card {
            background: #0f172a;
            border: 2px solid #eab308;
            width: 90%;
            max-width: 450px;
            border-radius: 16px;
            padding: 30px;
            text-align: center;
            position: relative;
        }

        .modal-card h2 {
            color: #eab308;
            margin-bottom: 10px;
            font-size: 22px;
        }

        .modal-card p {
            font-size: 14px;
            color: #94a3b8;
            margin-bottom: 20px;
            line-height: 1.5;
        }

        .payment-methods {
            background: #1e293b;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            text-align: left;
            font-size: 13px;
        }

        .payment-methods div {
            margin-bottom: 8px;
            color: #fff;
        }

        .close-modal {
            position: absolute;
            top: 15px; right: 15px;
            background: transparent;
            border: none;
            color: #64748b;
            font-size: 18px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- Sidebar Configuration Settings -->
    <div class="sidebar">
        <div class="logo-section">
            🚀 Professional Metadata Generator
        </div>
        
        <div class="menu-title">Metadata Adjustments</div>
        <div class="control-group">
            <div class="control-item">
                <label>Min Title Length</label>
                <div class="slider-container">
                    <input type="range" min="5" max="15" value="8" oninput="this.nextElementSibling.innerText = this.value">
                    <span class="range-val">8</span>
                </div>
            </div>
            <div class="control-item">
                <label>Max Title Length</label>
                <div class="slider-container">
                    <input type="range" min="15" max="45" value="25" oninput="this.nextElementSibling.innerText = this.value">
                    <span class="range-val">25</span>
                </div>
            </div>
            <div class="control-item">
                <label>Keywords Target</label>
                <div class="slider-container">
                    <input type="range" min="10" max="50" value="35" oninput="this.nextElementSibling.innerText = this.value">
                    <span class="range-val">35</span>
                </div>
            </div>
        </div>
