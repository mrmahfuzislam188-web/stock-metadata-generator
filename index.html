<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stock Metadata Generator - Premium Dashboard</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0b111e;
            color: #e2e8f0;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Sidebar Styling */
        .sidebar {
            width: 280px;
            background-color: #0f172a;
            border-right: 1px solid #1e293b;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .logo-section {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 18px;
            font-weight: bold;
            color: #38bdf8;
            padding-bottom: 15px;
            border-bottom: 1px solid #1e293b;
        }

        .menu-title {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #64748b;
            margin-top: 10px;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .control-item {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .control-item label {
            font-size: 13px;
            color: #94a3b8;
        }

        .slider-container {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        input[type="range"] {
            flex: 1;
            accent-color: #38bdf8;
        }

        .range-val {
            font-size: 12px;
            background: #1e293b;
            padding: 2px 6px;
            border-radius: 4px;
            min-width: 25px;
            text-align: center;
        }

        /* Main Content Styling */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            background-color: #0b111e;
            overflow-y: auto;
        }

        /* Top Navbar */
        .navbar {
            height: 65px;
            background-color: #0f172a;
            border-bottom: 1px solid #1e293b;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            padding: 0 30px;
            gap: 15px;
        }

        .nav-btn {
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
            border: none;
            font-weight: 500;
        }

        .btn-tutorial { background: #1e293b; color: #38bdf8; }
        .btn-contact { background: #ea580c; color: white; }
        .btn-pricing { background: #0284c7; color: white; }

        /* Dashboard Body */
        .dashboard-body {
            padding: 30px;
            max-width: 1100px;
            width: 100%;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 25px;
        }

        /* Platforms Tabs */
        .platforms-container {
            display: flex;
            justify-content: center;
            gap: 10px;
            background: #0f172a;
            padding: 10px;
            border-radius: 12px;
            border: 1px solid #1e293b;
            flex-wrap: wrap;
        }

        .platform-tab {
            padding: 8px 16px;
            border-radius: 8px;
            background: transparent;
            border: 1px solid transparent;
            color: #94a3b8;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s;
        }

        .platform-tab.active {
            background: #1e293b;
            border-color: #38bdf8;
            color: #38bdf8;
        }

        /* Upload / Central Box */
        .workspace-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 25px;
        }

        @media (max-width: 900px) {
            .workspace-grid { grid-template-columns: 1fr; }
        }

        .card {
            background: #0f172a;
            border: 1px solid #1e293b;
            border-radius: 16px;
            padding: 25px;
        }

        .upload-box {
            border: 2px dashed #1e293b;
            border-radius: 12px;
            padding: 40px 20px;
            text-align: center;
            cursor: pointer;
            transition: border-color 0.2s;
            background: #111a2e;
            margin-bottom: 20px;
        }

        .upload-box:hover {
            border-color: #38bdf8;
        }

        .upload-icon {
            font-size: 40px;
            color: #38bdf8;
            margin-bottom: 10px;
        }

        .file-type-btns {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 15px;
        }

        .type-btn {
            padding: 6px 16px;
            border-radius: 20px;
            border: none;
            cursor: pointer;
            font-size: 13px;
            background: #1e293b;
            color: #94a3b8;
        }

        .type-btn.active {
            background: #38bdf8;
            color: #0f172a;
            font-weight: bold;
        }

        /* Form Controls */
        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            font-size: 14px;
            color: #94a3b8;
            margin-bottom: 6px;
        }

        .form-group input, .form-group textarea {
            width: 100%;
            background: #0b111e;
            border: 1px solid #1e293b;
            border-radius: 8px;
            padding: 12px;
            color: white;
            font-size: 14px;
        }

        .form-group input:focus, .form-group textarea:focus {
            border-color: #38bdf8;
            outline: none;
        }

        .action-btns {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .btn-primary {
            flex: 1;
            background: #38bdf8;
            color: #0f172a;
            padding: 12px;
            border-radius: 8px;
            border: none;
            font-weight: bold;
            cursor: pointer;
        }

        .btn-secondary {
            background: #1e293b;
            color: white;
            padding: 12px 20px;
            border-radius: 8px;
            border: 1px solid #334155;
            cursor: pointer;
        }

        /* Output Box */
        .output-header {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 15px;
            color: #38bdf8;
        }

        #result {
            background: #0b111e;
            border: 1px solid #1e293b;
            border-radius: 8px;
            padding: 15px;
            min-height: 200px;
            white-space: pre-wrap;
            font-family: monospace;
            font-size: 13px;
            color: #cbd5e1;
        }
    </style>
</head>
<body>

    <!-- Sidebar Controls -->
    <div class="sidebar">
        <div class="logo-section">
            🌐 SKILL ITBD Clone
        </div>
        
        <div class="menu-title">Metadata Customization</div>
        <div class="control-group">
            <div class="control-item">
                <label>Min Title Words</label>
                <div class="slider-container">
                    <input type="range" min="5" max="15" value="8" oninput="this.nextElementSibling.innerText = this.value">
                    <span class="range-val">8</span>
                </div>
            </div>
            <div class="control-item">
                <label>Max Title Words</label>
                <div class="slider-container">
                    <input type="range" min="15" max="40" value="22" oninput="this.nextElementSibling.innerText = this.value">
                    <span class="range-val">22</span>
                </div>
            </div>
            <div class="control-item">
                <label>Min Keywords</label>
                <div class="slider-container">
                    <input type="range" min="10" max="30" value="25" oninput="this.nextElementSibling.innerText = this.value">
                    <span class="range-val">25</span>
                </div>
            </div>
            <div class="control-item">
                <label>Max Keywords</label>
                <div class="slider-container">
                    <input type="range" min="30" max="50" value="35" oninput="this.nextElementSibling.innerText = this.value">
                    <span class="range-val">35</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Main Workspace -->
    <div class="main-content">
        <!-- Top Navigation -->
        <div class="navbar">
            <button class="nav-btn btn-tutorial">Tutorial</button>
            <button class="nav-btn btn-contact">Contact</button>
            <button class="nav-btn btn-pricing">Pricing</button>
        </div>

        <div class="dashboard-body">
            <!-- Platform Navigation Tabs -->
            <div class="platforms-container">
                <button class="platform-tab active" onclick="selectPlatform(this, 'Adobe Stock')">St AdobeStock</button>
                <button class="platform-tab" onclick="selectPlatform(this, 'Shutterstock')">📷 Shutterstock</button>
                <button class="platform-tab" onclick="selectPlatform(this, 'Vecteezy')">📐 Vecteezy</button>
                <button class="platform-tab" onclick="selectPlatform(this, 'Depositphotos')">📦 Depositphotos</button>
            </div>

            <!-- Main Interactive Area -->
