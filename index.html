<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Stock Metadata Generator</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            color: #222;
        }

        .container {
            width: 92%;
            max-width: 900px;
            margin: 40px auto;
        }

        h1 {
            text-align: center;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }

        .card {
            background: white;
            padding: 25px;
            margin-bottom: 25px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input,
        textarea,
        select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 15px;
        }

        textarea {
            min-height: 100px;
            resize: vertical;
        }

        .buttons {
            display: flex;
            gap: 10px;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        button {
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            background: #111;
            color: white;
            font-size: 15px;
        }

        button:hover {
            opacity: 0.85;
        }

        #result {
            white-space: pre-wrap;
            word-wrap: break-word;
            background: #f5f5f5;
            padding: 15px;
            border-radius: 8px;
            min-height: 100px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Stock Metadata Generator</h1>

    <p class="subtitle">
        Adobe Stock • Shutterstock • Vecteezy
    </p>

    <div class="card">

        <label>Select Platform</label>

        <select id="platform">
            <option value="Adobe Stock">Adobe Stock</option>
            <option value="Shutterstock">Shutterstock</option>
            <option value="Vecteezy">Vecteezy</option>
        </select>


        <label>File Name</label>

        <input
            type="text"
            id="filename"
            placeholder="example-vector.jpg"
        >


        <label>Description</label>

        <textarea
            id="description"
            placeholder="Write your description..."
        ></textarea>


        <label>Keywords</label>

        <textarea
            id="keywords"
            placeholder="business, finance, growth, chart..."
        ></textarea>


        <label>Category</label>

        <input
            type="text"
            id="category"
            placeholder="Business"
        >


        <div class="buttons">

            <button onclick="generateMetadata()">
                Generate Metadata
            </button>

            <button onclick="copyMetadata()">
                Copy Metadata
            </button>

            <button onclick="downloadCSV()">
                Download CSV
            </button>

        </div>

    </div>


    <div class="card">

        <h2>Generated Metadata</h2>

        <div id="result">
            Your metadata will appear here...
        </div>

    </div>

</div>


<script>

function generateMetadata() {

    const platform =
        document.getElementById("platform").value;

    const filename =
        document.getElementById("filename").value;

    const description =
        document.getElementById("description").value;

    const keywords =
        document.getElementById("keywords").value;

    const category =
        document.getElementById("category").value;


    const result =
`Platform: ${platform}

Filename:
${filename}

Description:
${description}

Keywords:
${keywords}

Category:
${category}`;


    document.getElementById("result").textContent = result;
}


function copyMetadata() {

    const text =
        document.getElementById("result").textContent;

    navigator.clipboard.writeText(text);

    alert("Metadata copied successfully!");
}


function downloadCSV() {

    const filename =
        document.getElementById("filename").value;

    const description =
        document.getElementById("description").value;

    const keywords =
        document.getElementById("keywords").value;

    const category =
        document.getElementById("category").value;


    const csv =
`Filename,Description,Keywords,Category
"${filename}","${description}","${keywords}","${category}"`;


    const blob =
        new Blob([csv], {
            type: "text/csv;charset=utf-8;"
        });


    const url =
        URL.createObjectURL(blob);


    const link =
        document.createElement("a");

    link.href = url;

    link.download =
        "stock-metadata.csv";

    link.click();

    URL.revokeObjectURL(url);
}

</script>

</body>
</html>
